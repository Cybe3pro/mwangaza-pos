    <!-- =============================================================
         JAVASCRIPT
    ============================================================= -->

    <script>

    /*
     * ============================================================
     * MWANGAZA POS - LOGIN PAGE
     * ============================================================
     *
     * Features:
     * - Live clock
     * - Dynamic greeting
     * - Theme switching
     * - Password visibility
     * - Frontend validation
     * - REAL Flask backend authentication
     * - Session storage of logged-in user
     * ============================================================
     */


    // ============================================================
    // BACKEND CONFIGURATION
    // ============================================================

    const API_BASE_URL = "http://127.0.0.1:5000";


    // ============================================================
    // INITIALIZE APPLICATION
    // ============================================================

    document.addEventListener("DOMContentLoaded", () => {

        // Load Lucide icons
        lucide.createIcons();

        // Initialize page features
        initializeClock();
        initializeGreeting();
        initializeThemeToggle();
        initializePasswordToggle();
        initializeLoginForm();
        initializeForgotPassword();

    });


    // ============================================================
    // 1. LIVE CLOCK
    // ============================================================

    function initializeClock() {

        const timeElement =
            document.getElementById("currentTime");

        if (!timeElement) return;


        function updateClock() {

            const now = new Date();

            const hours =
                String(now.getHours()).padStart(2, "0");

            const minutes =
                String(now.getMinutes()).padStart(2, "0");

            const seconds =
                String(now.getSeconds()).padStart(2, "0");


            timeElement.textContent =
                `${hours}:${minutes}:${seconds}`;

        }


        updateClock();

        setInterval(updateClock, 1000);

    }


    // ============================================================
    // 2. DYNAMIC GREETING
    // ============================================================

    function initializeGreeting() {

        const greetingElement =
            document.getElementById("greetingText");

        if (!greetingElement) return;


        function updateGreeting() {

            const hour =
                new Date().getHours();


            if (hour < 12) {

                greetingElement.textContent =
                    "🌅 Good Morning,";

            } else if (hour < 18) {

                greetingElement.textContent =
                    "☀️ Good Afternoon,";

            } else {

                greetingElement.textContent =
                    "🌙 Good Evening,";

            }

        }


        updateGreeting();

        setInterval(updateGreeting, 60000);

    }


    // ============================================================
    // 3. THEME TOGGLE
    // ============================================================

    function initializeThemeToggle() {

        const toggleBtn =
            document.getElementById("themeToggle");

        const themeLabel =
            document.getElementById("themeLabel");

        const themeIcon =
            document.getElementById("themeIcon");

        const brandPanel =
            document.getElementById("brandPanel");

        const overlay =
            document.getElementById("overlay");


        if (!toggleBtn) return;


        toggleBtn.addEventListener("click", () => {

            const isVibrant =
                toggleBtn.dataset.theme === "vibrant";


            if (isVibrant) {

                // Switch to dark theme

                toggleBtn.dataset.theme = "dark";

                toggleBtn.classList.remove(
                    "bg-emerald-500",
                    "justify-end"
                );

                toggleBtn.classList.add(
                    "bg-slate-700",
                    "justify-start"
                );

                themeLabel.textContent = "Dark";

                themeIcon.textContent = "🌙";


                brandPanel.classList.remove(
                    "from-[#00b0ff]/20",
                    "via-[#00c853]",
                    "to-[#004d40]"
                );

                brandPanel.classList.add(
                    "from-slate-900",
                    "via-slate-800",
                    "to-slate-950"
                );


                overlay.classList.remove(
                    "bg-slate-950/65"
                );

                overlay.classList.add(
                    "bg-slate-950/85"
                );


            } else {

                // Switch to vibrant theme

                toggleBtn.dataset.theme = "vibrant";

                toggleBtn.classList.remove(
                    "bg-slate-700",
                    "justify-start"
                );

                toggleBtn.classList.add(
                    "bg-emerald-500",
                    "justify-end"
                );

                themeLabel.textContent = "Vibrant";

                themeIcon.textContent = "☀️";


                brandPanel.classList.remove(
                    "from-slate-900",
                    "via-slate-800",
                    "to-slate-950"
                );

                brandPanel.classList.add(
                    "from-[#00b0ff]/20",
                    "via-[#00c853]",
                    "to-[#004d40]"
                );


                overlay.classList.remove(
                    "bg-slate-950/85"
                );

                overlay.classList.add(
                    "bg-slate-950/65"
                );

            }

        });

    }


    // ============================================================
    // 4. PASSWORD VISIBILITY TOGGLE
    // ============================================================

    function initializePasswordToggle() {

        const toggleBtn =
            document.getElementById("togglePassword");

        const passwordInput =
            document.getElementById("passwordInput");

        const passwordIcon =
            document.getElementById("passwordIcon");


        if (!toggleBtn || !passwordInput) return;


        toggleBtn.addEventListener("click", () => {

            const isHidden =
                passwordInput.type === "password";


            passwordInput.type =
                isHidden ? "text" : "password";


            passwordIcon.setAttribute(
                "data-lucide",
                isHidden ? "eye" : "eye-off"
            );


            toggleBtn.setAttribute(
                "aria-label",
                isHidden
                    ? "Hide password"
                    : "Show password"
            );


            lucide.createIcons();

        });

    }


    // ============================================================
    // 5. LOGIN FORM
    // ============================================================

    function initializeLoginForm() {

        const loginForm =
            document.getElementById("loginForm");

        const usernameInput =
            document.getElementById("usernameInput");

        const passwordInput =
            document.getElementById("passwordInput");


        if (!loginForm) return;


        loginForm.addEventListener("submit", async (event) => {

            event.preventDefault();


            // Clear previous errors
            clearLoginErrors();


            const username =
                usernameInput.value.trim();

            const password =
                passwordInput.value;


            // ----------------------------------------------------
            // FRONTEND VALIDATION
            // ----------------------------------------------------

            let isValid = true;


            if (!username) {

                showFieldError(
                    "usernameError",
                    "Please enter your username."
                );

                isValid = false;

            }


            if (!password) {

                showFieldError(
                    "passwordError",
                    "Please enter your password."
                );

                isValid = false;

            }


            if (!isValid) {

                return;

            }


            // ----------------------------------------------------
            // START LOGIN REQUEST
            // ----------------------------------------------------

            setLoginLoading(true);


            try {

                console.log(
                    "Sending login request to:",
                    `${API_BASE_URL}/api/login`
                );


                const response =
                    await fetch(
                        `${API_BASE_URL}/api/login`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                username: username,
                                password: password
                            })
                        }
                    );


                // ------------------------------------------------
                // READ BACKEND RESPONSE
                // ------------------------------------------------

                const result =
                    await response.json();


                console.log(
                    "Backend login response:",
                    result
                );


                // ------------------------------------------------
                // LOGIN FAILED
                // ------------------------------------------------

                if (!response.ok ||
                    result.status !== "success") {

                    showLoginError(
                        result.message ||
                        "Invalid username or password."
                    );

                    return;

                }


                // ------------------------------------------------
                // LOGIN SUCCESSFUL
                // ------------------------------------------------

                const loggedInUser =
                    result.user;


                /*
                 * Store the authenticated user's information.
                 *
                 * We will use this later for:
                 *
                 * - Role-based permissions
                 * - Manager approval
                 * - Cashier restrictions
                 * - User identification
                 */

                if (
                    document.getElementById("rememberMe")
                        .checked
                ) {

                    localStorage.setItem(
                        "mwangazaUser",
                        JSON.stringify(loggedInUser)
                    );

                } else {

                    sessionStorage.setItem(
                        "mwangazaUser",
                        JSON.stringify(loggedInUser)
                    );

                }


                // ------------------------------------------------
                // SHOW SUCCESS STATE
                // ------------------------------------------------

                const loginButtonText =
                    document.getElementById(
                        "loginButtonText"
                    );

                if (loginButtonText) {

                    loginButtonText.textContent =
                        "Login Successful";

                }


                // ------------------------------------------------
                // REDIRECT TO DASHBOARD
                // ------------------------------------------------

                setTimeout(() => {

                    window.location.href =
                        "dashboard.html";

                }, 500);


            } catch (error) {

                console.error(
                    "Login request failed:",
                    error
                );


                showLoginError(
                    "Unable to connect to the Mwangaza POS backend. Please make sure the Flask server is running."
                );


            } finally {

                setLoginLoading(false);

            }

        });

    }


    // ============================================================
    // 6. LOGIN LOADING STATE
    // ============================================================

    function setLoginLoading(isLoading) {

        const loginButton =
            document.getElementById("loginButton");

        const loginButtonText =
            document.getElementById("loginButtonText");

        const loginButtonIcon =
            document.getElementById("loginButtonIcon");


        if (!loginButton) return;


        if (isLoading) {

            loginButton.disabled = true;

            loginButton.classList.add(
                "opacity-70",
                "cursor-not-allowed"
            );

            loginButtonText.textContent =
                "Checking...";


            loginButtonIcon.setAttribute(
                "data-lucide",
                "loader-circle"
            );

            loginButtonIcon.classList.add(
                "animate-spin"
            );


        } else {

            loginButton.disabled = false;

            loginButton.classList.remove(
                "opacity-70",
                "cursor-not-allowed"
            );


            /*
             * Don't overwrite "Login Successful"
             * after a successful login.
             */

            if (
                loginButtonText.textContent !==
                "Login Successful"
            ) {

                loginButtonText.textContent =
                    "Open Store";

            }


            loginButtonIcon.setAttribute(
                "data-lucide",
                "arrow-right"
            );

            loginButtonIcon.classList.remove(
                "animate-spin"
            );

        }


        lucide.createIcons();

    }


    // ============================================================
    // 7. SHOW FIELD ERROR
    // ============================================================

    function showFieldError(
        elementId,
        message
    ) {

        const errorElement =
            document.getElementById(elementId);


        if (!errorElement) return;


        const messageElement =
            errorElement.querySelector(
                "span:last-child"
            );


        if (messageElement) {

            messageElement.textContent =
                message;

        }


        errorElement.classList.remove(
            "hidden"
        );

    }


    // ============================================================
    // 8. SHOW GENERAL LOGIN ERROR
    // ============================================================

    function showLoginError(message) {

        const errorElement =
            document.getElementById("loginError");


        if (!errorElement) return;


        errorElement.textContent =
            message;


        errorElement.classList.remove(
            "hidden"
        );

    }


    // ============================================================
    // 9. CLEAR LOGIN ERRORS
    // ============================================================

    function clearLoginErrors() {

        const loginError =
            document.getElementById("loginError");

        const usernameError =
            document.getElementById("usernameError");

        const passwordError =
            document.getElementById("passwordError");


        if (loginError) {

            loginError.classList.add(
                "hidden"
            );

            loginError.textContent = "";

        }


        if (usernameError) {

            usernameError.classList.add(
                "hidden"
            );

        }


        if (passwordError) {

            passwordError.classList.add(
                "hidden"
            );

        }

    }


    // ============================================================
    // 10. FORGOT PASSWORD
    // ============================================================

    function initializeForgotPassword() {

        const forgotPasswordBtn =
            document.getElementById(
                "forgotPasswordBtn"
            );


        if (!forgotPasswordBtn) return;


        forgotPasswordBtn.addEventListener(
            "click",
            () => {

                showLoginError(
                    "Password recovery will be available after the user management system is connected."
                );

            }
        );

    }

</script>

</body>

</html>
